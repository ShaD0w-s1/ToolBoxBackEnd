name: Backend CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test api

  deploy:
    name: Deploy production API
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    environment: production
    timeout-minutes: 20
    env:
      TENCENTCLOUD_SECRETID: ${{ secrets.TCB_SECRET_ID }}
      TENCENTCLOUD_SECRETKEY: ${{ secrets.TCB_SECRET_KEY }}
      CLOUDBASE_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TOOLBOX_CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      DJANGO_PRODUCTION_SECRET_KEY: ${{ secrets.DJANGO_PRODUCTION_SECRET_KEY }}
      CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install CloudBase MCP
        shell: pwsh
        run: |
          npm install --no-save @cloudbase/cloudbase-mcp@latest
          $cliPath = (Resolve-Path 'node_modules/@cloudbase/cloudbase-mcp/dist/cli.cjs').Path
          $source = [IO.File]::ReadAllText($cliPath, [Text.Encoding]::UTF8)
          $marker = 'COS 上传超时（60秒）'
          $markerIndex = $source.IndexOf($marker)
          $timeoutIndex = $source.IndexOf('}, 60000);', $markerIndex)
          if ($markerIndex -lt 0 -or $timeoutIndex -lt 0) {
            throw 'Unable to locate the CloudBase MCP COS upload timeout'
          }
          $source = $source.Remove($timeoutIndex, 10).Insert($timeoutIndex, '}, 300000);')
          $source = $source.Replace($marker, 'COS 上传超时（300秒）')
          [IO.File]::WriteAllText($cliPath, $source, [Text.UTF8Encoding]::new($false))
          "CLOUDBASE_MCP_CLI=$cliPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy and smoke test
        shell: pwsh
        run: ./scripts/deploy-production.ps1 -SourceRef $env:GITHUB_SHA -Deploy
